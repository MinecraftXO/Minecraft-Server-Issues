
name:  问题反馈 / Bug Report
description: 请详细描述你遇到的问题，帮助我们改进。
title: "[Bug]: "
labels: ["bug","新提交的漏洞"]

body:
  - type: markdown
    attributes:
      value: |
        感谢你的反馈！为了让我们能更快地定位问题，请务必填写以下信息。
        
  - type: checkboxes
    id: checklist
    attributes:
      label:  确认信息
      description: 请勾选以下选项，确保你已提供足够的信息。
      options:
        - label: 我已在issue里搜索，没有类似Bug或相同Bug
          required: true
        - label: 我确认我是在反馈Bug，而并非提交Minecraft崩溃（可在Minecraft崩溃一栏解决）或Minecraft本身的Bug
          required: true

  - type: textarea
    id: description
    attributes:
      label: 📝 问题描述
      description: 请详细描述发生了什么，比如：“我在XXX时突然XXX了”。
      placeholder: 请输入详细的问题描述...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 🔍 复现步骤
      description: 如何重现这个问题？请按步骤列出。
      placeholder: |
        1. 进入服务器...
        2. 走到...
        3. 做了...
        4. 发生了错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: ✅ 期望的结果
      description: 正常情况下应该发生什么？
      placeholder: 我期望看到...
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 📷 截图或视频
      description: 如果有截图或录屏，请拖拽到这里上传，这非常有帮助！
      placeholder: 把附件上传至此
    validations:
      required: true

  - type: input
    id: game_id
    attributes:
      label: 🆔 额外信息 - 游戏ID
      description: 请填写你的游戏ID或其他相关ID。
      placeholder: 例如：Player123456
    validations:
      required: true
---
