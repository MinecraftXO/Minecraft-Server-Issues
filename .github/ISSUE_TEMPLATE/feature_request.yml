name: "新功能建议"
description: "为项目提出一个新的想法或功能"
title: "[Feature]: "
labels: ["enhancement","新提交的新功能"]
body:
  - type: markdown
    attributes:
      value: |
        "感谢你的建议！请尽可能详细地描述你的想法。"
  - type: textarea
    id: description
    attributes:
      label: "描述你的想法"
      description: "你希望增加什么功能？它解决了什么问题？"
      placeholder: "我希望增加XXX"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "你为什么要加这个功能？"
      description: "请描述你为什么要加这个功能"
      placeholder: "因为这样可以更好地XXX，如果没有这项功能，就要XXX，这很不友好"
